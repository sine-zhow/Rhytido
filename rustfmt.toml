# Rhytido formatting standard (AGENTS.md §2.1).
# Stable rustfmt options only; the toolchain currently has stable rustfmt.
edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true

# Nightly-only options (require `cargo +nightly fmt`); enable once a nightly
# rustfmt is available in the toolchain. Tracked in AGENTS.md §2.1.
# group_imports = "StdExternalCrate"
# imports_granularity = "Crate"
# wrap_comments = true
# format_code_in_doc_comments = true