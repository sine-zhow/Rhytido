[workspace]
resolver = "2"
members = ["crates/rhytido-backend", "crates/rhytido-core"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.86"
repository = "https://github.com/sine-zhow/rhytido"
authors = ["Rhytido contributors"]

[workspace.dependencies]
dashu-float = "0.6"
dashu-int = "0.6"
dashu-ratio = "0.6"
thiserror = "2"
rhytido-backend = { path = "crates/rhytido-backend" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1